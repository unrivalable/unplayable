name: Deploy results site

on:
  push:
    branches: [main]
    paths:
      - simulate.py
      - site/**
      - .github/workflows/deploy-site.yml
  workflow_dispatch:
    inputs:
      games:
        description: Number of games to simulate
        default: "5000"
      seed:
        description: Random seed (blank = random)
        default: "42"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run simulation and generate data.json
        run: |
          SEED_ARG=""
          if [ -n "${{ inputs.seed }}" ]; then
            SEED_ARG="--seed ${{ inputs.seed }}"
          fi
          python3 simulate.py --games "${{ inputs.games || '5000' }}" $SEED_ARG --quiet --json site/data.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
